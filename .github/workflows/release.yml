name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_tag: ${{ steps.check.outputs.should_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)"

      - name: Check whether this branch push touched VERSION
        id: check
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          # git diff, not the push webhook's head_commit.modified/added —
          # that field is populated inconsistently (empty on some pushes,
          # e.g. multi-commit pushes or certain mirrors/forced-pushes) and
          # silently skips the whole job with no run recorded when it's
          # wrong, which is exactly the bug this replaced.
          if git diff --name-only HEAD^ HEAD -- VERSION | grep -qx VERSION; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag from main
        if: github.ref == 'refs/heads/main' && steps.check.outputs.should_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Tag $TAG already exists; VERSION must be bumped for a new release." >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

  build-mac:
    if: startsWith(github.ref, 'refs/tags/') || needs.release-meta.outputs.should_tag == 'true'
    needs: release-meta
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Build PKG
        run: ./scripts/make-pkg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-mac
          path: |
            build/Whisper-*.dmg
            build/Whisper-*.pkg

  build-windows:
    runs-on: windows-latest
    needs: [release-meta, build-mac]
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Publish self-contained app
        run: >
          dotnet publish windows/Whisper.App/Whisper.App.csproj
          -c Release -r win-x64 -p:Platform=x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -p:WindowsAppSDKSelfContained=true
          -o windows/publish/win-x64
          -v:normal

      - name: Dump XAML compiler diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path windows/Whisper.App/obj -Recurse -Include *.log,*.err,*.json -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "----- $($_.FullName) -----"
              Get-Content $_.FullName
            }

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path windows/publish/win-x64/* `
            -DestinationPath "Whisper-Windows-${{ steps.version.outputs.version }}.zip"

      - name: Build MSI
        run: >
          wix build windows/Whisper.App/Installer/Package.wxs
          -arch x64
          -d PublishDir="${{ github.workspace }}\windows\publish\win-x64"
          -d Version=${{ needs.release-meta.outputs.version }}
          -o "Whisper-${{ steps.version.outputs.version }}.msi"

      - name: Verify the MSI actually installs silently
        shell: pwsh
        run: |
          $msi = "Whisper-${{ steps.version.outputs.version }}.msi"
          $log = "install.log"

          # This is the runner's built-in Administrator account, not a UAC
          # prompt -- so it can't verify Updater.cs's Verb="runas" elevation
          # request itself, only that /qn produces a real, non-broken
          # install once elevated. That's the actual unverified risk from
          # today's WIX0104 bug: whether the MSI installs cleanly at all.
          $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            Write-Host "::error::msiexec exited with code $($proc.ExitCode)"
            Get-Content $log -Tail 60
            exit 1
          }

          $installedExe = "C:\Program Files\Whisper\Whisper.App.exe"
          if (-not (Test-Path $installedExe)) {
            Write-Host "::error::Install reported success but $installedExe doesn't exist"
            Get-ChildItem "C:\Program Files\Whisper" -Recurse -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Installed OK: $installedExe"

      - name: Verify the installed app launches without crashing
        shell: pwsh
        run: |
          $exe = "C:\Program Files\Whisper\Whisper.App.exe"

          # This is the same silent-crash-on-launch class of bug reported
          # against a real Windows machine: an unhandled exception in
          # App.OnLaunched() (WinUI installs no default handler) kills the
          # process instantly with no dialog. A process that's still alive
          # after a few seconds is the strongest signal available in CI
          # that this isn't happening -- it can't verify tray icon
          # rendering, hotkey registration, or actual recording (those need
          # a real audio device and interactive desktop session), only that
          # startup itself doesn't throw and die.
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5

          $stillRunning = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $stillRunning) {
            $code = "0x{0:X8}" -f $proc.ExitCode
            Write-Host "::error::Whisper.App.exe exited within 5s of launch (exit code: $($proc.ExitCode) / $code)"

            # 0xC0000135 = STATUS_DLL_NOT_FOUND -- a native loader failure
            # before managed code (and any App.OnLaunched try/catch) ever
            # runs, so the .NET Runtime event source won't have it. The
            # Application log's generic error source (SideBySide /
            # Application Error, event 1000) is where the loader records
            # which specific DLL it couldn't resolve.
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-2)} -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'Whisper' -or $_.ProviderName -match 'SideBySide|Application Error|.NET Runtime' } |
              Format-List TimeGenerated, ProviderName, Id, Message

            Write-Host "--- Publish output DLLs (for comparison) ---"
            Get-ChildItem "C:\Program Files\Whisper" -Filter *.dll | Select-Object Name | Sort-Object Name

            # Forensics for the specific 0xc000027b / Microsoft.UI.Xaml.dll
            # fault this step exists to catch. Exit code alone can't
            # distinguish "VC++ runtime missing" from "reg-free WinRT
            # activation manifest wrong/missing" -- these three checks do:
            Write-Host "--- VC++ runtime presence (candidate: missing/mismatched CRT) ---"
            foreach ($crt in 'VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll','ucrtbase.dll') {
              $found = Get-ChildItem "C:\Program Files\Whisper" -Filter $crt -ErrorAction SilentlyContinue
              $sys32 = Test-Path "C:\Windows\System32\$crt"
              Write-Host "$crt -- app-local: $([bool]$found), System32: $sys32"
            }

            Write-Host "--- Embedded reg-free WinRT activation manifest (candidate: self-contained WinRT registration) ---"
            $mtDumpPath = "manifest-dump.xml"
            $mt = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windows.sdk.buildtools" -Recurse -Filter mt.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if ($mt) {
              $mtOutput = & $mt.FullName -nologo -inputresource:"$exe;#1" -out:$mtDumpPath 2>&1
              Write-Host "mt.exe exit code: $LASTEXITCODE"
              if ($mtOutput) { Write-Host "mt.exe output: $mtOutput" }
              if ((Test-Path $mtDumpPath) -and (Get-Item $mtDumpPath).Length -gt 0) {
                $size = (Get-Item $mtDumpPath).Length
                Write-Host "Embedded manifest extracted ($size bytes) -- looking for Microsoft.ui.xaml.dll activatable classes:"
                $matches = Select-String -Path $mtDumpPath -Pattern 'ui\.xaml|activatableClass' -SimpleMatch:$false
                if ($matches) {
                  $matches | Select-Object -First 40
                } else {
                  Write-Host "No matches -- dumping full manifest content since it's small enough to be worth seeing directly:"
                  Get-Content $mtDumpPath -Raw
                }
              } else {
                Write-Host "mt.exe found but produced no/empty output file -- extraction genuinely failed, not just 'no matches'."
              }
            } else {
              Write-Host "mt.exe not found under NuGet cache; skipping manifest dump."
            }

            Write-Host "--- WindowsAppSDK component package versions actually restored (candidate: version skew) ---"
            Get-ChildItem "windows\Whisper.App\obj" -Filter project.assets.json -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object {
                $assets = Get-Content $_.FullName -Raw | ConvertFrom-Json
                $assets.libraries.PSObject.Properties.Name | Where-Object { $_ -match '^Microsoft\.WindowsAppSDK' } | Sort-Object
              }

            exit 1
          }

          Write-Host "Launched OK, still running after 5s (PID $($proc.Id))"
          Stop-Process -Id $proc.Id -Force

      - name: Uninstall the test install
        if: always()
        shell: pwsh
        run: |
          $msi = "Whisper-${{ steps.version.outputs.version }}.msi"
          if (Test-Path $msi) {
            Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-windows
          path: |
            Whisper-Windows-*.zip
            Whisper-*.msi

  publish-release:
    runs-on: ubuntu-latest
    needs: [release-meta, build-mac, build-windows]
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: whisper-mac
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: whisper-windows
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          files: |
            release-assets/Whisper-*.dmg
            release-assets/Whisper-*.pkg
            release-assets/Whisper-Windows-*.zip
            release-assets/Whisper-*.msi
          generate_release_notes: true
          body: |
            Unsigned release (no Apple Developer ID or Windows signing certificate).
            macOS: right-click Whisper.app and choose Open on first launch.
            Windows: click "More info" > "Run anyway" in SmartScreen.
            The Windows .msi installs to Program Files + Start Menu; the .zip is portable.
